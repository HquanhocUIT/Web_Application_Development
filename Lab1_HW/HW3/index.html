<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Resilient landing page with countdown and registration form."
    />

    <title>Resilient Landing Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Resilient Landing Page</h1>
      <p>Event registration and countdown.</p>
    </header>

    <main>
      <!-- Countdown Section -->
      <section id="countdown" aria-labelledby="countdown-title">
        <h2 id="countdown-title">Event Countdown</h2>

        <div class="countdown-display" aria-label="Event countdown">
          <div class="countdown-item">
            <span id="days" class="countdown-value">00</span>
            <span class="countdown-label">Days</span>
          </div>

          <div class="countdown-item">
            <span id="hours" class="countdown-value">00</span>
            <span class="countdown-label">Hours</span>
          </div>

          <div class="countdown-item">
            <span id="minutes" class="countdown-value">00</span>
            <span class="countdown-label">Minutes</span>
          </div>

          <div class="countdown-item">
            <span id="seconds" class="countdown-value">00</span>
            <span class="countdown-label">Seconds</span>
          </div>
        </div>
      </section>

      <!-- Registration Form Section -->
      <section id="registration" aria-labelledby="registration-title">
        <h2 id="registration-title">Registration</h2>

        <form>
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" />
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
          </div>

          <button type="submit">Register</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Resilient Landing Page</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
