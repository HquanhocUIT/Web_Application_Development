<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini-React | Exercise 1</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #1e293b;
      background-color: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .page {
      width: min(100% - 2rem, 960px);
      margin: 0 auto;
      padding: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .page-header,
    .panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
    }

    .page-header h1 {
      margin-top: 0;
    }

    .page-header p {
      color: #475569;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1.5rem;
    }

    .panel h2 {
      margin-top: 0;
    }

    .mini-app {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .mini-app button {
      align-self: flex-start;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .mini-app button:hover {
      background: #1d4ed8;
    }

    .mini-app button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    #test-summary {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    #test-results {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #test-results li {
      padding: 0.75rem;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    .pass {
      background: #dcfce7;
      color: #166534;
    }

    .fail {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (min-width: 768px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: start;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <h1>Mini-React VNode & Mounting Engine</h1>
      <p>
        Lab 2 — Exercise 1: Browser Mounting and Verification
      </p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="app-heading">
        <h2 id="app-heading">Mini-React Application</h2>

        <div id="app"></div>
      </section>

      <section class="panel" aria-labelledby="tests-heading">
        <h2 id="tests-heading">Browser Test Results</h2>

        <p id="test-summary" role="status" aria-live="polite">
          Waiting for tests...
        </p>

        <ul id="test-results" aria-label="Test results"></ul>
      </section>
    </div>
  </div>

  <script type="module" src="./test-runner.js"></script>
</body>

</html>
