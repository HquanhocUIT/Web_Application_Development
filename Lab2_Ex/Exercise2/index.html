<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A minimal Task Manager interface for Web Engineering Exercise 2." />
  <title>Task Manager | Exercise 2</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="page-shell">
    <section class="task-app" id="task-app" aria-labelledby="app-title">
      <header class="app-header">
        <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> YOUR WORKSPACE</div>
        <div class="header-row">
          <div>
            <h1 id="app-title">Task Manager<span class="title-period">.</span></h1>
            <p class="subtitle">A little progress, every day.</p>
          </div>
          <div class="task-counter" aria-live="polite" aria-atomic="true">
            <strong id="task-count">3</strong>
            <span>total tasks</span>
          </div>
        </div>
      </header>

      <form class="add-task-form" id="add-task-form" autocomplete="off">
        <label class="sr-only" for="new-task-input">New task</label>
        <input id="new-task-input" name="task" type="text" placeholder="What needs to get done?" maxlength="160" required />
        <button class="button button-primary" type="submit" data-action="add"> <span aria-hidden="true">+</span> Add Task</button>
      </form>

      <section class="tasks-section" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <h2 id="tasks-heading">My Tasks</h2>
          <div class="filter-group" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-button is-active" data-action="filter" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-button" data-action="filter" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter-button" data-action="filter" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
        </div>

        <!-- Static sample tasks. The reactive renderer will own this list in a later milestone. -->
        <ul class="task-list" id="task-list" aria-label="Task list">
          <li class="task-item" data-task-id="sample-1">
            <span class="task-content"><span class="task-check" aria-hidden="true"></span><span class="task-label">Review Web Engineering lecture notes</span></span>
            <div class="task-actions">
              <button type="button" class="icon-button complete-button" data-action="toggle" data-id="sample-1" aria-label="Complete Review Web Engineering lecture notes" title="Mark completed">✓</button>
              <button type="button" class="icon-button delete-button" data-action="delete" data-id="sample-1" aria-label="Delete Review Web Engineering lecture notes" title="Delete task">×</button>
            </div>
          </li>
          <li class="task-item is-completed" data-task-id="sample-2">
            <span class="task-content"><span class="task-check" aria-hidden="true">✓</span><span class="task-label">Create project structure</span></span>
            <div class="task-actions">
              <button type="button" class="icon-button complete-button" data-action="toggle" data-id="sample-2" aria-label="Mark Create project structure active" title="Mark active">↶</button>
              <button type="button" class="icon-button delete-button" data-action="delete" data-id="sample-2" aria-label="Delete Create project structure" title="Delete task">×</button>
            </div>
          </li>
          <li class="task-item" data-task-id="sample-3">
            <span class="task-content"><span class="task-check" aria-hidden="true"></span><span class="task-label">Plan reactive state implementation</span></span>
            <div class="task-actions">
              <button type="button" class="icon-button complete-button" data-action="toggle" data-id="sample-3" aria-label="Complete Plan reactive state implementation" title="Mark completed">✓</button>
              <button type="button" class="icon-button delete-button" data-action="delete" data-id="sample-3" aria-label="Delete Plan reactive state implementation" title="Delete task">×</button>
            </div>
          </li>
        </ul>
        <p class="empty-state" id="empty-state" hidden>No tasks to show. Add one to get started!</p>
      </section>
      <footer class="app-footer"><span>Stay focused. Keep moving.</span><span>Exercise 02 · Web Engineering</span></footer>
    </section>
  </main>
</body>
</html>
